<!doctype html>

<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101426">
  <meta name="description" content="Administración de gustos y preferencias de usuarios de Nova Apps.">
  <title>Gustos y preferencias · Nova Apps</title>  <link rel="stylesheet" href="./css/admin.css">
  <link rel="stylesheet" href="./css/gustos-usuarios.css">  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg, #101426);
      color: var(--text, #edf1fa);
      font-family: system-ui, sans-serif;
    }

    .gustos-page {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .gustos-topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .gustos-topbar a {
      color: inherit;
      text-decoration: none;
    }

    .gustos-panel {
      padding: 22px;
      border: 1px solid #39425b;
      border-radius: 16px;
      background: rgba(255, 255, 255, .035);
    }

    .gustos-status {
      margin: 16px 0;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(130, 150, 190, .12);
      overflow-wrap: anywhere;
    }

    .gustos-status[hidden] {
      display: none;
    }

    .gustos-button {
      display: inline-block;
      padding: 10px 15px;
      border: 1px solid #596987;
      border-radius: 9px;
      background: #202b45;
      color: #fff;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .gustos-page {
        width: min(100% - 20px, 1100px);
        padding-top: 14px;
      }

      .gustos-panel {
        padding: 14px;
      }
    }
  </style>  <script type="module">
    import { setupAuth, guardPage } from "./admin-core.js";

    setupAuth();

    const autorizado = await guardPage();

    if (autorizado) {
      document.body.dataset.adminAuthorized = "true";
    }
  </script></head><body>
  <main class="gustos-page">
    <nav class="gustos-topbar" aria-label="Navegación administrativa">
      <a href="./admin.html">← Volver a Administración</a>
      <a href="./index.html">Nova Apps</a>
    </nav><section class="gustos-panel">
  <h1>Gustos y preferencias de usuarios</h1>
  <p>
    Área administrativa para consultar y gestionar los intereses,
    categorías favoritas, idioma y preferencias de comunicación.
  </p>

  <p id="gustosEstado" class="gustos-status" role="status" aria-live="polite">
    Verificando acceso administrativo…
  </p>

  <div id="gustosContenido" hidden>
    <div id="gustosModulo"></div>
  </div>
</section>

  </main>  <script type="module">
    import { guardPage } from "./admin-core.js";

    const estado = document.getElementById("gustosEstado");
    const contenido = document.getElementById("gustosContenido");
    const modulo = document.getElementById("gustosModulo");

    async function iniciar() {
      try {
        const autorizado = await guardPage();

        if (!autorizado) return;

        estado.hidden = true;
        contenido.hidden = false;

        const script = document.createElement("script");
        script.src = "./js/admin/gustos-usuarios.js";

        script.onload = () => {
          if (!window.NOVA_ADMIN_GUSTOS) {
            estado.hidden = false;
            estado.textContent = "No se pudo iniciar el módulo de preferencias.";
            contenido.hidden = true;
            return;
          }

          /*
           * La lista de usuarios reales se conectará cuando se complete
           * la integración segura con Supabase.
           * No se inventan usuarios ni se muestran datos de ejemplo.
           */
          document.body.dataset.role = "administrador";

          window.NOVA_ADMIN_GUSTOS.render(modulo, []);
        };

        script.onerror = () => {
          estado.hidden = false;
          estado.textContent = "No se pudo cargar el módulo de preferencias.";
          contenido.hidden = true;
        };

        document.body.appendChild(script);
      } catch {
        estado.textContent = "No se pudo verificar el acceso administrativo.";
      }
    }

    iniciar();
  </script></body>
</html>
