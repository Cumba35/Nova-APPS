
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101426">
  <meta name="description" content="Administración del catálogo de aplicaciones de Nova Apps.">
  <title>Aplicaciones · Nova Apps</title>

  <link rel="stylesheet" href="css/admin-apps.css">
</head>

<body>
<main>
  <h1>Gestión de aplicaciones</h1>
  <p class="muted">
    Añade, edita, publica o elimina aplicaciones del catálogo.
  </p>

  <p id="message" role="status" aria-live="polite">
    Preparando conexión...
  </p>

  <section id="login" class="hidden">
    <h2>Iniciar sesión</h2>
    <p>Accede con la cuenta de Google autorizada.</p>
    <button id="loginBtn" type="button">Iniciar sesión con Google</button>
  </section>

  <section id="panel" class="hidden">
    <p id="account" class="muted"></p>

    <nav class="nav" aria-label="Administración">
      <a href="./admin.html">Menú principal</a>
      <a href="./admin-diseno.html">Diseño</a>
      <a href="./admin-rangos.html">Rangos</a>
      <a href="./admin-config.html">Configuración</a>
      <a href="./inspectores.html">Inspectores</a>
    </nav>

    <button id="logoutBtn" class="secondary" type="button">
      Cerrar sesión
    </button>
  </section>

  <div id="content" class="hidden">
    <section>
      <h2 id="formTitle">Añadir aplicación</h2>

      <form id="appForm">
        <input id="appId" type="hidden">

        <label for="name">Nombre</label>
        <input id="name" required maxlength="100">

        <label for="description">Descripción</label>
        <textarea id="description" rows="3" maxlength="2000"></textarea>

        <label for="url">URL de la aplicación</label>
        <input id="url" type="url" placeholder="https://...">

        <label for="status">Estado</label>
        <select id="status">
          <option>En desarrollo</option>
          <option>Disponible</option>
          <option>En mantenimiento</option>
        </select>

        <label>
          <input id="published" type="checkbox">
          Publicada y visible
        </label>

        <button type="submit">Guardar aplicación</button>
        <button type="button" id="cancelBtn" class="secondary">
          Cancelar edición
        </button>
      </form>
    </section>

    <section>
      <h2>Catálogo</h2>
      <button id="refreshBtn" class="secondary" type="button">
        Actualizar lista
      </button>
      <div id="apps"></div>
    </section>
  </div>

  <p><a href="./">Volver a Nova Apps</a></p>
</main>

<script type="module">
import {
  $,
  supabase,
  guardPage,
  setupAuth,
  say,
  safeUrl
} from './admin-core.js';

setupAuth();

async function loadApps() {
  const box = $('#apps');
  box.replaceChildren();

  say('Cargando aplicaciones...');

  const { data, error } = await supabase
    .from('apps')
    .select('*')
    .order('id', { ascending: false });

  if (error) {
    say('Error al cargar aplicaciones: ' + error.message);
    return;
  }

  if (!data?.length) {
    box.textContent = 'Todavía no hay aplicaciones.';
    say('Catálogo cargado.');
    return;
  }

  for (const app of data) {
    const card = document.createElement('article');
    card.className = 'app';

    const title = document.createElement('h3');
    title.textContent = app.name || 'Aplicación sin nombre';

    const desc = document.createElement('p');
    desc.textContent = app.description || 'Sin descripción.';

    const state = document.createElement('p');
    state.textContent =
      'Estado: ' + (app.status || 'Sin especificar') +
      ' · ' + (app.published ? 'Publicada' : 'Oculta');

    card.append(title, desc, state);

    if (app.url) {
      const url = safeUrl(app.url);

      if (url) {
        const link = document.createElement('a');
        link.href = url;
        link.textContent = 'Abrir aplicación';
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        card.append(link);
      }
    }

    const edit = document.createElement('button');
    edit.type = 'button';
    edit.textContent = 'Editar';

    edit.addEventListener('click', () => {
      $('#appId').value = app.id ?? '';
      $('#name').value = app.name || '';
      $('#description').value = app.description || '';
      $('#url').value = app.url || '';
      $('#status').value = app.status || 'En desarrollo';
      $('#published').checked = Boolean(app.published);
      $('#formTitle').textContent = 'Editar aplicación';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    const del = document.createElement('button');
    del.type = 'button';
    del.textContent = 'Eliminar';
    del.className = 'delete';

    del.addEventListener('click', async () => {
      if (!confirm('¿Eliminar "' + (app.name || 'esta aplicación') + '"?')) {
        return;
      }

      say('Eliminando aplicación...');

      const { error: deleteError } = await supabase
        .from('apps')
        .delete()
        .eq('id', app.id);

      if (deleteError) {
        say('Error al eliminar: ' + deleteError.message);
        return;
      }

      say('Aplicación eliminada.');
      await loadApps();
    });

    card.append(edit, del);
    box.append(card);
  }

  say('Catálogo cargado. Aplicaciones encontradas: ' + data.length);
}

function resetForm() {
  $('#appForm').reset();
  $('#appId').value = '';
  $('#formTitle').textContent = 'Añadir aplicación';
}

$('#appForm').addEventListener('submit', async event => {
  event.preventDefault();

  const name = $('#name').value.trim();
  const description = $('#description').value.trim();
  const rawUrl = $('#url').value.trim();
  const url = rawUrl ? safeUrl(rawUrl) : '';
  const status = $('#status').value;
  const published = $('#published').checked;
  const id = $('#appId').value;

  if (!name) {
    say('Escribe el nombre de la aplicación.');
    return;
  }

  if (rawUrl && !url) {
    say('La URL debe comenzar con https://.');
    return;
  }

  const saveButton = $('#appForm').querySelector('button[type="submit"]');
  saveButton.disabled = true;
  say('Guardando aplicación...');

  try {
    const result = id
      ? await supabase
          .from('apps')
          .update({ name, description, url, status, published })
          .eq('id', id)
      : await supabase
          .from('apps')
          .insert({ name, description, url, status, published });

    if (result.error) {
      say('No se pudo guardar: ' + result.error.message);
      return;
    }

    resetForm();
    say('Aplicación guardada.');
    await loadApps();
  } catch (error) {
    say('Error inesperado: ' + (error?.message || String(error)));
  } finally {
    saveButton.disabled = false;
  }
});

$('#cancelBtn').addEventListener('click', resetForm);
$('#refreshBtn').addEventListener('click', loadApps);

const autorizado = await guardPage();

if (autorizado) {
  $('#content').classList.remove('hidden');
  await loadApps();
}
</script>
</body>
</html>
