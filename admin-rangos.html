<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101426">
  <title>Nova Apps — Administrar rangos</title>
  <link rel="stylesheet" href="./css/admin-rangos.css">
</head>
<body>
<main>
  <h1>Administrar rangos</h1>
  <p class="muted">Gestión de cuentas y permisos de Nova Apps.</p>

  <section id="login" class="panel">
    <h2>Iniciar sesión</h2>
    <p>Entra con la cuenta de Google autorizada como propietaria.</p>
    <button id="loginBtn" type="button">Iniciar sesión con Google</button>
  </section>

  <section id="panel" class="hidden">
    <div class="panel">
      <p id="account" class="muted">Comprobando sesión...</p>
      <div class="row">
        <button id="refreshRanksBtn" type="button" class="secondary">Actualizar rangos</button>
        <button id="logoutBtn" type="button" class="secondary">Cerrar sesión</button>
      </div>
      <p id="message" role="status" aria-live="polite"></p>
    </div>

    <div class="panel">
      <h2>Asignar rango</h2>
      <label for="rankUser">Cuenta</label>
      <select id="rankUser" disabled>
        <option value="">Cargando cuentas...</option>
      </select>

      <label for="rankChoice">Nuevo rango</label>
      <select id="rankChoice">
        <option value="Administrador">Administrador</option>
        <option value="Inspectores">Inspectores</option>
        <option value="Usuario VIP">Usuario VIP</option>
        <option value="Usuario">Usuario</option>
        <option value="Visitante">Visitante</option>
      </select>

      <button id="saveRankBtn" type="button" disabled>Guardar rango</button>
    </div>

    <div class="panel">
      <h2>Cuentas y rangos registrados</h2>
      <div id="rankList"></div>
    </div>
  </section>
</main>

<script type="module">
import {
  $, supabase, guardPage, setupAuth,
  RANKS, RANK_ASSETS, RANK_ICON_BASE
} from './admin-core.js';

setupAuth();

const $user = $('#rankUser');
const $rank = $('#rankChoice');
const $list = $('#rankList');
const $refresh = $('#refreshRanksBtn');
const $save = $('#saveRankBtn');
const $message = $('#message');

let profiles = [];
let busy = false;

function message(text) {
  $message.textContent = text;
}

function normalizeRank(value) {
  const ranks = {
    propietario: 'Propietario',
    administrador: 'Administrador',
    admin: 'Administrador',
    inspectores: 'Inspectores',
    inspector: 'Inspectores',
    usuario_vip: 'Usuario VIP',
    'usuario vip': 'Usuario VIP',
    usuario: 'Usuario',
    visitante: 'Visitante'
  };

  return ranks[String(value || '').trim().toLowerCase()] || 'Visitante';
}

function renderProfiles() {
  $user.replaceChildren();
  $list.replaceChildren();

  if (!profiles.length) {
    const option = document.createElement('option');
    option.value = '';
    option.textContent = 'No hay perfiles disponibles';
    $user.append(option);
    $list.textContent = 'No se encontraron registros visibles en nova_user_roles.';
    return;
  }

  for (const profile of profiles) {
    const option = document.createElement('option');
    option.value = profile.user_id;
    option.textContent = `${profile.user_id} — ${normalizeRank(profile.role)}`;
    $user.append(option);

    const card = document.createElement('article');
    card.className = 'profile';

    const rank = normalizeRank(profile.role);
    const title = document.createElement('strong');
    title.textContent = `Rango: ${rank}`;

    const id = document.createElement('p');
    id.textContent = `ID: ${profile.user_id}`;

    const asset = RANK_ASSETS[rank];
    card.append(title, id);

    if (asset) {
      const image = document.createElement('img');
      image.className = 'rank-icon';
      image.alt = `Icono del rango ${rank}`;
      image.src = RANK_ICON_BASE + asset.file;
      image.onerror = () => image.remove();
      card.prepend(image);
    }

    $list.append(card);
  }

  $rank.value = normalizeRank(
    profiles.find(p => p.user_id === $user.value)?.role
  );
}

async function loadRanks() {
  if (busy) return;

  busy = true;
  $refresh.disabled = true;
  $save.disabled = true;
  $user.disabled = true;
  message('Consultando rangos en Supabase...');

  try {
    const { data, error } = await supabase
      .from('nova_user_roles')
      .select('user_id,role');

    if (error) {
      console.error('Error al consultar rangos:', error);
      profiles = [];
      renderProfiles();
      message(`No se pudieron consultar los rangos: ${error.message}`);
      return;
    }

    profiles = Array.isArray(data) ? data : [];
    profiles.sort((a, b) =>
      String(a.user_id || '').localeCompare(String(b.user_id || ''))
    );

    renderProfiles();
    message(`Consulta completada. Registros visibles: ${profiles.length}.`);
  } catch (error) {
    console.error(error);
    message(`Error inesperado: ${error.message || String(error)}`);
  } finally {
    busy = false;
    $refresh.disabled = false;
    $user.disabled = profiles.length === 0;
    $save.disabled = profiles.length === 0;
  }
}

async function saveRank() {
  if (busy) return;

  const userId = $user.value;
  const rank = $rank.value;

  if (!userId) {
    message('Selecciona una cuenta.');
    return;
  }

  if (!RANKS.includes(rank) || rank === 'Propietario') {
    message('El rango seleccionado no está permitido.');
    return;
  }

  if (userId === 'e2b76b60-09b4-4e01-a93f-00c9bd7e257e') {
    message('No se puede modificar el rango del propietario.');
    return;
  }

  if (!confirm(`¿Asignar el rango "${rank}" a ${userId}?`)) return;

  busy = true;
  $save.disabled = true;
  $refresh.disabled = true;
  message('Guardando rango...');

  try {
    const { data: sessionData, error: sessionError } =
      await supabase.auth.getUser();

    if (sessionError || !sessionData?.user) {
      message('La sesión ha expirado. Inicia sesión de nuevo.');
      return;
    }

    const { error } = await supabase
      .from('nova_user_roles')
      .update({ role: rank })
      .eq('user_id', userId);

    if (error) {
      console.error('Error guardando rango:', error);
      message(`No se pudo guardar el rango: ${error.message}`);
      return;
    }

    message('Solicitud de actualización completada.');
    await loadRanks();
  } catch (error) {
    console.error(error);
    message(`Error inesperado: ${error.message || String(error)}`);
  } finally {
    busy = false;
    $refresh.disabled = false;
    $user.disabled = profiles.length === 0;
    $save.disabled = profiles.length === 0;
  }
}

$user.addEventListener('change', () => {
  const profile = profiles.find(p => p.user_id === $user.value);
  $rank.value = normalizeRank(profile?.role);
});

$refresh.addEventListener('click', loadRanks);
$save.addEventListener('click', saveRank);

const authorized = await guardPage();

if (authorized) {
  $('#login').classList.add('hidden');
  $('#panel').classList.remove('hidden');
  await loadRanks();
}
</script>
</body>
</html>
